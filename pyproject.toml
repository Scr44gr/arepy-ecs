[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"


[project]
name = "arepy-ecs"
version = "0.1.0"
authors = [{ name = "Abrahan", email = "scr44gr@protonmail.com" }]
description = "High-performance Entity Component System (ECS) for Python, powered by Rust."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "maturin>=1.8,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<0.12",
]

[tool.maturin]
manifest-path = "crates/arepy_ecs_py/Cargo.toml"
python-source = "src"
module-name = "arepy_ecs._native"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"